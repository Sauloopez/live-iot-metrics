; Common settings for every node configuration. Each configuration compiles the shared
; code plus its own folder (see docs/tundra/PLAN.md, section 4.6).
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

build_flags =
    -D CORE_DEBUG_LEVEL=5

lib_ldf_mode = deep+
build_type = debug

; CoAP over WiFi (the current node)
[env:coap]
build_src_filter = +<shared/> +<coap/>
lib_deps =
    ${env.lib_deps}
    hirotakaster/CoAP simple library @ ^1.3.24
