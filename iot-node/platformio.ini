; Node configurations share the code in src/shared and add their own folder
; (see docs/tundra/PLAN.md, section 4.6). `native` runs the hardware independent tests on the PC.

[platformio]
default_envs = coap

; Base for every ESP32 node configuration
[esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

build_flags =
    -D CORE_DEBUG_LEVEL=5

lib_ldf_mode = deep+
build_type = debug
; Native tests run in the `native` environment
test_ignore = test_native_*

; CoAP over WiFi (the current node)
[env:coap]
extends = esp32
build_src_filter = +<shared/> +<coap/>
lib_deps =
    ${esp32.lib_deps}
    hirotakaster/CoAP simple library @ ^1.3.24

; Hardware independent tests on the PC: `pio test -e native`
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
build_src_filter = -<*>
lib_ldf_mode = deep+
test_filter = test_native_*
