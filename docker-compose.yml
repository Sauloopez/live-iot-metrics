services:
  db:
    image: timescale/timescaledb:2.25.2-pg17
    container_name: db
    restart: always
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      device: ./data
      o: bind
networks:
  app-network:
    driver: bridge
